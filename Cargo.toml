[package]
name = "ungoggled"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
semver = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
drm = "0.14"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
lto = "thin"
strip = true

